#!/usr/sbin/nft -f

# Dedicated-host input policy. Docker owns its forwarding/NAT tables; do not
# flush the complete nftables ruleset. Worker workspace egress is separately
# enforced through Docker's DOCKER-USER chain.
table inet nubols_host {
  chain input {
    type filter hook input priority filter; policy drop;
    iifname "lo" accept
    ct state established,related accept
    ct state invalid drop
    ip protocol icmp accept
    ip6 nexthdr ipv6-icmp accept
    tcp dport 22 ct state new limit rate 15/minute burst 20 packets accept
    tcp dport { 80, 443 } accept
    tcp dport 20000-20099 accept
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }
}
