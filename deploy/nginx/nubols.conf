map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream nubols_control_plane {
    server 127.0.0.1:7790;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name nubols.com www.nubols.com app.nubols.com *.apps.nubols.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nubols.com www.nubols.com app.nubols.com;

    ssl_certificate /etc/letsencrypt/live/nubols.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nubols.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /opt/nubols/current/nebula-cloud/apps/web/dist;
    index index.html;

    location /api/ {
        client_max_body_size 32m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://nubols_control_plane;
    }

    location /p/ {
        client_max_body_size 32m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://nubols_control_plane;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.apps.nubols.com;
    ssl_certificate /etc/letsencrypt/live/nubols.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nubols.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://nubols_control_plane;
    }
}
